name: Validate Boundary Literature

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install jsonschema pyyaml pytest

      - name: Validate governance dependency-map mirror
        run: python scripts/validate_governance_dependency_map_mirror.py

      - name: Validate mirror freshness
        run: python scripts/validate_mirror_freshness.py

      - name: Validate boundary schema controls
        run: python scripts/validate_boundary_schema_controls.py

      - name: Validate Boundary W2-8 LLOS adapter
        run: python scripts/validate_llos_boundary_adapter.py

      - name: Run tests
        run: python -m pytest -q
