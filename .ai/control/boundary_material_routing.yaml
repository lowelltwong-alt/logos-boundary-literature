routing_policy_id: BOUNDARY-MATERIAL-ROUTING-v1
owner_repo: logos-boundary-literature
canonical_authority_repo: logos-scripture-graph
supporting_boundary_repo: logos-boundary-literature
governance_authority_repo: logos-governance-architecture
status: active_policy

authority_hierarchy:
  governance_policy_authority: logos-governance-architecture
  canonical_scripture_authority: logos-scripture-graph
  boundary_support_authority: logos-boundary-literature
  boundary_repo_can_override_scripture: false
  boundary_repo_can_equal_scripture_authority: false
  governance_repo_can_define_cross_repo_policy: true

canonical_scope:
  default_corpus: none
  canonical_claims_owned_here: false
  canonical_scripture_reference_only: true

accepted_boundary_material_classes:
  - deuterocanonical_apocrypha
  - noncanonical_boundary_literature
  - heterodox_or_gnostic_texts
  - disputed_attribution_texts
  - known_forgery_or_fake_texts
  - commentary_reception_corpus
  - josephus_philo_dss_qumran_corpora
  - patristic_reception_corpora
  - church_father_citation_metadata
  - theologian_writing_source_metadata
  - denominational_reception_metadata

route_to_scripture_graph:
  - canonical_66_scripture_passages
  - canonical_scripture_chunks
  - canonical_scripture_gold_evaluator_surfaces
  - canonical_scripture_graph_outputs
  - canonical_corpus_correction

route_to_governance_repo:
  - cross_repo_authority_policy
  - repository_link_contracts
  - rule_registry_policy
  - update_flow_policy
  - validation_contract_policy

forbidden_in_boundary_repo:
  - canonical_scripture_source_text_corpus
  - canonical_scripture_chunks
  - canonical_truth_claims
  - unscoped_commentary_claims
  - boundary_claims_overriding_scripture
  - boundary_claims_equaling_scripture_authority
  - commentary_data_in_canonical_scripture_tables
  - patristic_data_in_canonical_scripture_tables
  - theologian_data_in_canonical_scripture_tables
  - denomination_profile_data_in_canonical_scripture_tables
  - theologian_or_commentary_claims_as_scripture_authority

allowed_in_boundary_repo:
  - source_intake_plans
  - source_status_records
  - trust_profiles
  - scoped_boundary_claims
  - commentary_metadata
  - church_father_citation_metadata
  - patristic_reception_metadata
  - theologian_writing_source_metadata
  - attribution_and_forgery_status
  - scoped_background_links
  - comparison_reception_refutation_relationships
  - scripture_references_without_scripture_text

boundary_claims_require_scope:
  - trust_level
  - tradition_scope
  - profile_scope
  - provenance

data_flow_guardrails:
  scripture_refs_may_point_to_boundary_material_as: background_or_comparison
  boundary_literature_may_reference_scripture: true
  commentary_may_discuss_scripture_and_boundary_literature: true
  boundary_claims_can_mutate_canonical_scripture_records: false
  boundary_material_in_default_scripture_retrieval: false
  scripture_text_stored_here: false
  unified_evidence_products_are_derived_artifacts: true
  canonical_tables_may_include_boundary_data: false
  canonical_tables_may_include_commentary_data: false
  canonical_tables_may_include_patristic_data: false
  canonical_tables_may_include_theologian_data: false
  canonical_tables_may_include_denominational_profile_data: false
  derived_database_allowed_prefixes:
    - boundary_
    - evidence_
  stop_if_boundary_material_required_to_modify_canonical_outputs: true

boundary_governance_constraint_policy:
  policy_id: BOUNDARY-GOV-001
  title: Governance Is Constraint, Not Obstacle
  importance: P0
  applies_to_origin:
    - logos-boundary-literature
    - boundary_layer_agents
    - boundary_layer_automation
    - external_contributor_boundary_requests
  boundary_layer_may_treat_governance_as_blocker_or_obstacle: false
  boundary_layer_may_optimize_around_governance: false
  boundary_layer_may_auto_request_governance_change: false
  boundary_layer_may_auto_route_permission_request: false
  boundary_layer_may_bundle_governance_change_with_boundary_work: false
  required_behavior: stop_and_create_human_escalation_warning
  warning_required: true
  protected_higher_authority_targets:
    - logos-governance-architecture
    - logos-scripture-graph
    - canonical_scripture_authority
    - repository_link_contracts
    - cross_repo_policy
    - trust_hierarchy
    - canonical_scope
  forbidden_boundary_actions:
    - bypass_governance_policy
    - weaken_repository_link_contracts
    - request_canonical_scripture_mutation_from_boundary_layer
    - request_cross_repo_policy_change_from_boundary_layer
    - treat_governance_as_implementation_friction
    - route_around_higher_authority_review
  escalation_warning_requires:
    - conflict_description
    - higher_authority_repo_identified
    - owner_reserved_authorization_notice

owner_reserved_authorization:
  policy_id: BOUNDARY-GOV-002
  title: Owner-Reserved Authorization for Boundary-Originated Higher-Layer Changes
  authorized_owner: Lowell Wong
  applies_when_boundary_request_targets:
    - governance_layer_policy
    - canonical_scripture_authority
    - repository_link_contracts
    - canonical_scope
    - trust_hierarchy
    - cross_repo_policy
  contributor_consensus_sufficient: false
  contributor_volume_sufficient: false
  automated_recommendation_sufficient: false
  agent_routing_sufficient: false
  boundary_layer_operational_need_sufficient: false
  requires_explicit_owner_authorization: true
  authorization_must_occur_in_higher_authority_repo: true

boundary_layer_escalation_warning_text: |
  WARNING: Boundary-layer request conflicts with higher-authority governance.

  The requested boundary-layer task appears to require changing or bypassing governance-layer policy, canonical Scripture authority, repository-link contracts, routing policy, trust hierarchy, or canonical scope.

  Governance is binding authority, not an obstacle to optimize around.

  Do not automate, route, or implement this change from the boundary layer. A human maintainer must review the conflict directly in the higher-authority repository.

  Owner-reserved authorization required: only Lowell Wong, as project owner, may authorize a boundary-originated request to change higher-authority governance, canonical Scripture authority, repository-link contracts, canonical scope, trust hierarchy, or cross-repo policy. Contributor consensus, contributor volume, automated recommendation, agent routing, or boundary-layer operational need is not sufficient authority.

stop_triggers:
  - boundary_layer_treats_governance_as_obstacle
  - boundary_originated_request_targets_higher_authority_layer
  - boundary_originated_request_lacks_owner_authorization
  - commentary_or_theologian_claim_treated_as_scripture_authority
  - boundary_data_routed_to_canonical_scripture_table
  - boundary_record_missing_tradition_or_profile_scope
